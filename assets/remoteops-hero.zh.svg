<svg width="1600" height="700" viewBox="0 0 1600 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B18"/>
      <stop offset="0.52" stop-color="#0B1530"/>
      <stop offset="1" stop-color="#11153A"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glowBlue" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSmall" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" stroke="#7DD3FC" stroke-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1600" height="700" rx="28" fill="url(#bg)"/>
  <rect x="28" y="28" width="1544" height="644" rx="22" stroke="#334155" stroke-opacity="0.65"/>
  <rect x="28" y="28" width="1544" height="644" rx="22" fill="url(#grid)"/>

  <g opacity="0.65" filter="url(#glowSmall)">
    <circle cx="120" cy="130" r="3" fill="#67E8F9"/>
    <circle cx="1470" cy="120" r="3" fill="#A78BFA"/>
    <circle cx="140" cy="585" r="3" fill="#60A5FA"/>
    <circle cx="1475" cy="580" r="3" fill="#67E8F9"/>
  </g>

  <text x="92" y="112" fill="#E2E8F0" font-family='Inter,Segoe UI,Noto Sans CJK SC,Microsoft YaHei,sans-serif' font-size="28" font-weight="700" letter-spacing="4">REMOTEOPS</text>
  <text x="92" y="152" fill="#94A3B8" font-family='Inter,Segoe UI,Noto Sans CJK SC,Microsoft YaHei,sans-serif' font-size="18" letter-spacing="1.5">AI 辅助的受控远程运维</text>

  <!-- Connection spine -->
  <path d="M445 330H610" stroke="#60A5FA" stroke-width="5" stroke-linecap="round" filter="url(#glowSmall)"/>
  <path d="M990 330H1155" stroke="#A78BFA" stroke-width="5" stroke-linecap="round" filter="url(#glowSmall)"/>
  <path d="M610 330H990" stroke="url(#violet)" stroke-width="2" stroke-dasharray="8 12" opacity="0.65"/>
  <path d="M595 316L615 330L595 344" stroke="#67E8F9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1140 316L1160 330L1140 344" stroke="#C4B5FD" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Agent card -->
  <g>
    <rect x="88" y="218" width="360" height="226" rx="18" fill="#0F1B35" stroke="#3B82F6" stroke-width="2"/>
    <rect x="112" y="249" width="312" height="112" rx="12" fill="#07101F" stroke="#1D4ED8" stroke-opacity="0.8"/>
    <circle cx="143" cy="283" r="7" fill="#34D399" filter="url(#glowSmall)"/>
    <text x="164" y="290" fill="#A7F3D0" font-family="ui-monospace,monospace" font-size="16">agent.connected</text>
    <text x="132" y="328" fill="#60A5FA" font-family="ui-monospace,monospace" font-size="16">PS&gt; Get-Host</text>
    <text x="132" y="352" fill="#CBD5E1" font-family="ui-monospace,monospace" font-size="14">Windows x64 · 主动出站 TLS</text>
    <text x="112" y="402" fill="#E2E8F0" font-family='Inter,Segoe UI,Noto Sans CJK SC,Microsoft YaHei,sans-serif' font-size="21" font-weight="700">现场 Windows Agent</text>
  </g>

  <!-- Relay card -->
  <g>
    <rect x="610" y="198" width="380" height="266" rx="20" fill="#17163A" stroke="#8B5CF6" stroke-width="2"/>
    <path d="M690 326C690 286 720 256 760 256H840C880 256 910 286 910 326C910 366 880 396 840 396H760C720 396 690 366 690 326Z" fill="url(#violet)" opacity="0.2"/>
    <path d="M730 326L760 326M760 326L745 311M760 326L745 341" stroke="#EDE9FE" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M815 326H858" stroke="#EDE9FE" stroke-width="10" stroke-linecap="round"/>
    <circle cx="715" cy="225" r="5" fill="#A78BFA"/>
    <circle cx="735" cy="225" r="5" fill="#A78BFA" opacity="0.7"/>
    <circle cx="755" cy="225" r="5" fill="#A78BFA" opacity="0.4"/>
    <text x="800" y="420" text-anchor="middle" fill="#F5F3FF" font-family='Inter,Segoe UI,Noto Sans CJK SC,Microsoft YaHei,sans-serif' font-size="21" font-weight="700">自托管 Relay</text>
    <text x="800" y="444" text-anchor="middle" fill="#C4B5FD" font-family='Inter,Segoe UI,Noto Sans CJK SC,Microsoft YaHei,sans-serif' font-size="14">TLS · 配对 · 会话 · 策略</text>
  </g>

  <!-- MCP card -->
  <g>
    <rect x="1155" y="218" width="360" height="226" rx="18" fill="#102B3A" stroke="#06B6D4" stroke-width="2"/>
    <rect x="1180" y="250" width="310" height="80" rx="12" fill="#08202B" stroke="#0E7490"/>
    <text x="1204" y="282" fill="#A5F3FC" font-family="ui-monospace,monospace" font-size="15">remoteops MCP</text>
    <text x="1204" y="307" fill="#E0F2FE" font-family="ui-monospace,monospace" font-size="14">读取 → 审批 → 执行</text>
    <path d="M1190 367H1480" stroke="#155E75"/>
    <circle cx="1200" cy="392" r="6" fill="#67E8F9"/>
    <text x="1218" y="398" fill="#CFFAFE" font-family='Inter,Segoe UI,Noto Sans CJK SC,Microsoft YaHei,sans-serif' font-size="15">Codex / AI 客户端</text>
    <text x="1180" y="426" fill="#E2E8F0" font-family='Inter,Segoe UI,Noto Sans CJK SC,Microsoft YaHei,sans-serif' font-size="21" font-weight="700">本机 MCP 控制</text>
  </g>

  <!-- Approval and audit rail -->
  <path d="M260 570C540 522 1060 522 1340 570" stroke="#334155" stroke-width="2" stroke-dasharray="5 10"/>
  <g transform="translate(470 527)">
    <path d="M70 0L124 20V64C124 101 98 126 70 138C42 126 16 101 16 64V20L70 0Z" fill="#172554" stroke="#60A5FA" stroke-width="2"/>
    <path d="M46 67L62 83L94 48" stroke="#93C5FD" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="160" y="54" fill="#E2E8F0" font-family='Inter,Segoe UI,Noto Sans CJK SC,Microsoft YaHei,sans-serif' font-size="20" font-weight="700">人工审批</text>
    <text x="160" y="82" fill="#94A3B8" font-family='Inter,Segoe UI,Noto Sans CJK SC,Microsoft YaHei,sans-serif' font-size="15">会话绑定 · 可审计 · 可中断</text>
  </g>
  <g transform="translate(1000 527)">
    <rect x="0" y="18" width="74" height="74" rx="14" fill="#172554" stroke="#A78BFA" stroke-width="2"/>
    <path d="M20 42H54M20 57H54M20 72H43" stroke="#C4B5FD" stroke-width="6" stroke-linecap="round"/>
    <text x="100" y="54" fill="#E2E8F0" font-family='Inter,Segoe UI,Noto Sans CJK SC,Microsoft YaHei,sans-serif' font-size="20" font-weight="700">脱敏审计</text>
    <text x="100" y="82" fill="#94A3B8" font-family='Inter,Segoe UI,Noto Sans CJK SC,Microsoft YaHei,sans-serif' font-size="15">聊天、传输和日志中不含敏感信息</text>
  </g>
</svg>
