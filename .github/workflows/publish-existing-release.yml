name: Publish existing release build

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Release run whose validate, Windows, Linux and macOS jobs all succeeded'
        required: true
        type: string
      release_tag:
        description: 'Existing release tag matching that build commit'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_ASSET_ROOT: ${{ runner.temp }}/remoteops-release-assets
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify source build and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          source_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          tag_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
          jq -e --arg tag "$RELEASE_TAG" --arg sha "$tag_commit" '
            .event == "push" and .path == ".github/workflows/release.yml" and
            .head_branch == $tag and .head_sha == $sha and .status == "completed"
          ' <<< "$source_run"
          source_jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?filter=latest&per_page=100")"
          for job in validate windows linux macos-mcp; do
            jq -e --arg job "$job" '
              [.jobs[] | select(.name == $job)] |
              length == 1 and .[0].conclusion == "success"
            ' <<< "$source_jobs"
          done
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
          pattern: '*-release'
          path: release
          merge-multiple: true
      - name: Assemble release assets
        run: bash scripts/Assemble-GitHubReleaseAssets.sh release "${RELEASE_TAG#v}" "$RELEASE_ASSET_ROOT"
      - name: Validate final release assets
        shell: pwsh
        run: ./scripts/Test-GitHubReleaseAssets.ps1 -AssetRoot $env:RELEASE_ASSET_ROOT -Version $env:RELEASE_TAG.Substring(1)
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.release_tag }}
          generate_release_notes: true
          prerelease: true
          files: ${{ runner.temp }}/remoteops-release-assets/*
