name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Test release artifact gate
        shell: pwsh
        run: ./scripts/Test-ReleaseArtifactGate.ps1
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y pkg-config libudev-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Match tag to Cargo version
        shell: pwsh
        run: |
          $metadata = cargo metadata --format-version 1 --no-deps --locked | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -EQ 'remoteops-agent').version
          if ($env:GITHUB_REF_NAME -cne "v$version") {
            throw "Release tag must be exactly v$version; got $env:GITHUB_REF_NAME"
          }
          if (-not (Select-String -LiteralPath CHANGELOG.md -SimpleMatch "## [$version]" -Quiet)) {
            throw "CHANGELOG.md does not contain version $version"
          }
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --exclude remoteops-agent-gui --exclude remoteops-controller-gui --locked
      - run: cargo clippy --workspace --exclude remoteops-agent-gui --exclude remoteops-controller-gui --all-targets --locked -- -D warnings
      - run: cargo test --workspace --exclude remoteops-agent-gui --exclude remoteops-controller-gui --locked
      - name: Check documentation
        shell: pwsh
        run: ./scripts/Test-Documentation.ps1
      - name: Scan repository secrets
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test release artifact gate
        shell: pwsh
        run: ./scripts/Test-ReleaseArtifactGate.ps1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo test --workspace --locked -- --test-threads=1
      - shell: pwsh
        run: ./scripts/Build-Release.ps1 -SkipLinux
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release
          path: artifacts/release/**/*

  linux:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y pkg-config libudev-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Build Linux Agent package
        run: bash scripts/Build-LinuxAgent.sh release/linux-agent
      - name: Build Linux Relay
        run: |
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/remoteops --remap-path-prefix=$HOME/.cargo=/cargo --remap-path-prefix=$HOME=/user"
          export CFLAGS="-ffile-prefix-map=$GITHUB_WORKSPACE=/remoteops -fdebug-prefix-map=$GITHUB_WORKSPACE=/remoteops -ffile-prefix-map=$HOME/.cargo=/cargo -fdebug-prefix-map=$HOME/.cargo=/cargo -ffile-prefix-map=$HOME=/user -fdebug-prefix-map=$HOME=/user"
          cargo build --release --locked -p remoteops-relay
      - run: |
          mkdir -p release/linux-x64
          cp target/release/remoteops-relay release/linux-x64/remoteops-relay
      - name: Add license manifests
        shell: pwsh
        run: ./scripts/New-ThirdPartyNotices.ps1 -OutputDirectory ./release/linux-x64
      - name: Check release artifacts
        shell: pwsh
        run: ./scripts/Test-ReleaseArtifacts.ps1 -ArtifactRoot ./release/linux-x64 -RequireLegalFiles
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-release
          path: release/**/*

  macos-mcp:
    needs: validate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Test MCP on macOS host
        run: |
          cargo test -p remoteops-controller-mcp --locked
          bash -n deploy/controller-mcp/macos/*.sh scripts/Build-MacosMcp.sh
      - name: Build Apple Silicon MCP package
        run: bash ./scripts/Build-MacosMcp.sh ./release/macos-arm64
      - name: Check macOS release artifacts
        shell: pwsh
        run: ./scripts/Test-ReleaseArtifacts.ps1 -ArtifactRoot ./release/macos-arm64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-mcp-release
          path: release/**/*

  publish:
    needs: [validate, windows, linux, macos-mcp]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release
          merge-multiple: true
      - name: Assemble release assets
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          windows_dir="$(find release -type d -name windows-x64 -print -quit)"
          mcp_zip="$(find release -type f -name 'RemoteOps-MCP-Windows-x64-*.zip' -print -quit)"
          macos_mcp="$(find release -type f -name 'RemoteOps-MCP-macOS-arm64-*.tar.gz' -print -quit)"
          relay_bin="$(find release -type f -path '*/linux-x64/remoteops-relay' -print -quit)"
          test -n "$windows_dir"
          test -n "$mcp_zip"
          test -n "$macos_mcp"
          test -n "$relay_bin"
          mkdir -p assets
          (cd "$windows_dir" && zip -9 -r "$GITHUB_WORKSPACE/assets/RemoteOps-Windows-x64-$version.zip" .)
          cp "$mcp_zip" "assets/RemoteOps-MCP-Windows-x64-$version.zip"
          cp "$macos_mcp" "assets/RemoteOps-MCP-macOS-arm64-$version.tar.gz"
          tar -C "$(dirname "$relay_bin")" -czf "assets/RemoteOps-Relay-Linux-x64-$version.tar.gz" remoteops-relay LICENSE THIRD_PARTY_LICENSES.txt DEPENDENCIES.json
          find release -name 'RemoteOps-Agent-linux-x64-*.tar.gz' -exec cp {} assets/ \;
          (cd assets && sha256sum RemoteOps-* > SHA256SUMS.txt)
      - name: Validate final release assets
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: ./scripts/Test-GitHubReleaseAssets.ps1 -AssetRoot ./assets -Version $env:RELEASE_VERSION.Substring(1)
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          prerelease: true
          files: assets/*
