name: Security

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'assets/**'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'assets/**'
  schedule:
    - cron: "17 3 * * 1"

permissions:
  checks: write
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y pkg-config libudev-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --exclude remoteops-agent-gui --exclude remoteops-agent-service --exclude remoteops-controller-gui --locked
      - run: cargo clippy --workspace --exclude remoteops-agent-gui --exclude remoteops-agent-service --exclude remoteops-controller-gui --all-targets --locked -- -D warnings
      - run: cargo test --workspace --exclude remoteops-agent-gui --exclude remoteops-agent-service --exclude remoteops-controller-gui --locked
      - name: Check documentation
        shell: pwsh
        run: ./scripts/Test-Documentation.ps1
      - name: Scan repository secrets
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

