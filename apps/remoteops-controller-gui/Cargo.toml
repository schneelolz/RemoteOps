[package]
name = "remoteops-controller-gui"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "RemoteOps Windows-first 人工控制端 GUI"
build = "../../build/windows-resource.rs"

[package.metadata.winresource]
FileDescription = "RemoteOps Controller GUI"
ProductName = "RemoteOps"
OriginalFilename = "remoteops-controller-gui.exe"
LegalCopyright = "Copyright (c) RemoteOps contributors"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
eframe.workspace = true
egui-phosphor.workspace = true
hex.workspace = true
remoteops-application = { path = "../../crates/remoteops-application" }
remoteops-ai = { path = "../../crates/remoteops-ai" }
remoteops-audit = { path = "../../crates/remoteops-audit" }
remoteops-domain = { path = "../../crates/remoteops-domain" }
remoteops-i18n = { path = "../../crates/remoteops-i18n" }
remoteops-protocol = { path = "../../crates/remoteops-protocol" }
remoteops-serial = { path = "../../crates/remoteops-serial" }
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml = "1.1"
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
keyring = "4.1"
keyring-core = "1.0"

[build-dependencies]
winresource.workspace = true

# Supply winit's platform backend for Linux workspace checks.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { workspace = true, features = ["x11"] }

[lints]
workspace = true
