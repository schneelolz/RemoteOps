[package]
name = "remoteops-controller-mcp"
version = "0.2.0-preview.13"
publish = false
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "RemoteOps 本地 STDIO MCP 服务"
build = "../../build/windows-resource.rs"

[package.metadata.winresource]
FileDescription = "RemoteOps Controller MCP"
ProductName = "RemoteOps"
OriginalFilename = "remoteops-controller-mcp.exe"
LegalCopyright = "Copyright (c) RemoteOps contributors"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
clap.workspace = true
chrono.workspace = true
rand.workspace = true
reqwest.workspace = true
rustls.workspace = true
uuid.workspace = true
remoteops-enrollment = { path = "../../crates/remoteops-enrollment" }
hex.workspace = true
remoteops-application = { path = "../../crates/remoteops-application" }
remoteops-audit = { path = "../../crates/remoteops-audit" }
remoteops-domain = { path = "../../crates/remoteops-domain" }
remoteops-protocol = { path = "../../crates/remoteops-protocol" }
rmcp = { version = "3.0.1", features = ["elicitation", "server", "transport-io"] }
schemars = "1.0"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
toml_edit = "0.25"
zeroize.workspace = true

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
keyring = "4.1"

[target.'cfg(target_os = "windows")'.dependencies]
keyring-core = "1.0"

[dev-dependencies]
rcgen = "0.14"
tokio-rustls.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
security-framework = "3.7"

[build-dependencies]
winresource.workspace = true

[lints]
workspace = true
