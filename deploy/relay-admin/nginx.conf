pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    # Docker DNS 动态解析，后端独立重建后无需重新发布前端。
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        client_max_body_size 1100m;
        location = /healthz { default_type text/plain; return 200 'ok'; }
        location /api/ {
            set $admin_api http://remoteops-relay:18081;
            proxy_pass $admin_api$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection '';
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
        }
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control 'public, max-age=31536000, immutable';
            add_header X-Content-Type-Options nosniff always;
        }
        location = /release.json { add_header Cache-Control no-store; }
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control no-cache;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy same-origin always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        }
    }
}
