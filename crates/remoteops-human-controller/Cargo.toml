[package]
name = "remoteops-human-controller"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[target.'cfg(windows)'.dependencies]
remoteops-desktop-media = { path = "../remoteops-desktop-media" }

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
remoteops-domain = { path = "../remoteops-domain" }
remoteops-application = { path = "../remoteops-application" }
remoteops-audit = { path = "../remoteops-audit" }
remoteops-protocol = { path = "../remoteops-protocol", features = ["desktop-lan"] }
