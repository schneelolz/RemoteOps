[workspace]
resolver = "2"
members = [
    "crates/remoteops-domain",
    "crates/remoteops-protocol",
    "crates/remoteops-session",
    "crates/remoteops-serial",
    "crates/remoteops-policy",
    "crates/remoteops-audit",
    "crates/remoteops-device",
    "crates/remoteops-application",
    "crates/remoteops-ai",
    "crates/remoteops-i18n",
    "apps/remoteops-relay",
    "apps/remoteops-agent",
    "apps/remoteops-agent-service",
    "apps/remoteops-agent-gui",
    "apps/remoteops-ssh-askpass",
    "apps/remoteops-controller-cli",
    "apps/remoteops-controller-mcp",
    "apps/remoteops-credential-prompt",
    "apps/remoteops-controller-gui",
    "apps/remoteops-serial-demo",
    "tests/remoteops-mcp-smoke",
]

[workspace.package]
version = "0.2.0-preview.5"
edition = "2024"
license = "AGPL-3.0-only"
authors = ["RemoteOps contributors"]
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1.0"
argon2 = "0.5"
axum = "0.8"
async-trait = "0.1"
base64 = "0.22"
bytes = "1.10"
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.29"
futures-util = "0.3"
hex = "0.4"
hpke = { version = "0.14", default-features = false, features = ["alloc", "chacha", "getrandom", "x25519"] }
process-wrap = { version = "9.1", features = ["tokio1"] }
rand = "0.8"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.17", features = ["v4", "serde"] }
zeroize = "1.9"
winresource = "0.1.31"
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow", "persistence", "wgpu"] }
egui-phosphor = "0.13.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
